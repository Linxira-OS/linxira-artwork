<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linxira Apex Brand Concept</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #20272b; color: #f4f7f8; font-family: "Segoe UI", "Noto Sans", sans-serif; }
    main { width: 1440px; min-height: 1000px; padding: 56px 64px 72px; margin: 0 auto; }
    header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 38px; }
    h1 { margin: 0; font-size: 42px; font-weight: 650; letter-spacing: 0; }
    header p { margin: 0 0 6px; color: #aab5ba; font-size: 18px; }
    .marks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 24px; }
    .sample { height: 250px; display: grid; place-items: center; border: 1px solid #414b50; background: #111619; }
    .sample.light { background: #eef3f4; }
    .sample.accent { background: #20b8b0; }
    .sample img { width: 162px; height: 162px; }
    .wallpapers { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .wallpapers img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid #414b50; }
    footer { display: flex; justify-content: space-between; margin-top: 22px; color: #9ea9ae; font-size: 16px; }
    strong { color: #f36f5d; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Linxira Apex</h1>
      <p>Angular L / flat color / workstation graphics</p>
    </header>
    <section class="marks">
      <div class="sample"><img src="../assets/concepts/linxira-apex-mark.svg" alt="Primary mark on dark"></div>
      <div class="sample light"><img src="../assets/concepts/linxira-apex-mark.svg" alt="Primary mark on light"></div>
      <div class="sample accent"><img src="../assets/concepts/linxira-apex-mark-mono.svg" alt="Monochrome mark"></div>
    </section>
    <section class="wallpapers">
      <img src="../assets/concepts/linxira-apex-wallpaper-dark.svg" alt="Dark wallpaper">
      <img src="../assets/concepts/linxira-apex-wallpaper-light.svg" alt="Light wallpaper">
    </section>
    <footer>
      <span>Primary <strong>#20B8B0</strong> / Signal <strong>#F36F5D</strong></span>
      <span>Concept 01 / 2026.07</span>
    </footer>
  </main>
</body>
</html>
