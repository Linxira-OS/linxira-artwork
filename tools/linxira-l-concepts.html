<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linxira L Concepts</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #171d20; color: #f4f7f8; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { width: 1440px; min-height: 1040px; margin: 0 auto; padding: 52px 60px; }
    header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 34px; }
    h1 { margin: 0; font-size: 40px; font-weight: 650; letter-spacing: 0; }
    header p { margin: 0 0 5px; color: #a8b2b7; font-size: 17px; }
    .concepts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    article { border: 1px solid #3b454a; background: #20272b; }
    .stage { height: 390px; display: grid; place-items: center; background: #0f1417; }
    .stage img { width: 260px; height: 260px; }
    .info { padding: 22px 24px 26px; }
    h2 { margin: 0 0 6px; font-size: 24px; font-weight: 650; letter-spacing: 0; }
    .info p { height: 48px; margin: 0; color: #aeb8bd; font-size: 16px; line-height: 1.5; }
    .sizes { height: 104px; margin-top: 20px; display: flex; align-items: center; gap: 28px; padding: 0 24px; background: #eef3f4; }
    .sizes img:nth-child(1) { width: 64px; height: 64px; }
    .sizes img:nth-child(2) { width: 32px; height: 32px; }
    .sizes img:nth-child(3) { width: 24px; height: 24px; }
    footer { margin-top: 28px; padding-top: 22px; border-top: 1px solid #3b454a; color: #98a4a9; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Linxira 标志方向</h1>
      <p>保留清晰大写 L，以内部语言建立识别度</p>
    </header>
    <section class="concepts">
      <article>
        <div class="stage"><img src="../assets/concepts/linxira-l-contour.svg" alt="层叠纹 L"></div>
        <div class="info">
          <h2>01 层叠纹</h2>
          <p>连续双线沿 L 转角展开，像等高线、轨道和数据层。</p>
          <div class="sizes">
            <img src="../assets/concepts/linxira-l-contour.svg" alt="64 px">
            <img src="../assets/concepts/linxira-l-contour.svg" alt="32 px">
            <img src="../assets/concepts/linxira-l-contour.svg" alt="24 px">
          </div>
        </div>
      </article>
      <article>
        <div class="stage"><img src="../assets/concepts/linxira-l-circuit.svg" alt="电路纹 L"></div>
        <div class="info">
          <h2>02 电路纹</h2>
          <p>线路和节点放进 L 内部，偏计算、实验设备和工程工作站。</p>
          <div class="sizes">
            <img src="../assets/concepts/linxira-l-circuit.svg" alt="64 px">
            <img src="../assets/concepts/linxira-l-circuit.svg" alt="32 px">
            <img src="../assets/concepts/linxira-l-circuit.svg" alt="24 px">
          </div>
        </div>
      </article>
      <article>
        <div class="stage"><img src="../assets/concepts/linxira-l-facet.svg" alt="折面纹 L"></div>
        <div class="info">
          <h2>03 折面纹</h2>
          <p>用三个平面突出 L 的转角，保持纯色、稳定和小尺寸识别。</p>
          <div class="sizes">
            <img src="../assets/concepts/linxira-l-facet.svg" alt="64 px">
            <img src="../assets/concepts/linxira-l-facet.svg" alt="32 px">
            <img src="../assets/concepts/linxira-l-facet.svg" alt="24 px">
          </div>
        </div>
      </article>
    </section>
    <footer>共同原则：不是 A、不是山峰、不是外框图标；主体始终是可直接读出的 Linxira 首字母 L。</footer>
  </main>
</body>
</html>
